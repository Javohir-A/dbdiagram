      - default: 10
        description: page size, max 1000
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VersionList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - ApiKeyAuth: []
      summary: Diagram version list
      tags:
      - versions
    post:
      consumes:
      - application/json
      description: Takes a manual snapshot of the saved state of the diagram. The
        body is optional.
      parameters:
      - description: diagram guid
        in: path
        name: key
        required: true
        type: string
      - description: label
        in: body
