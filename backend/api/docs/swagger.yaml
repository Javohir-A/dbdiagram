    put:
      consumes:
      - application/json
      parameters:
      - description: folder guid
        in: path
        name: key
        required: true
        type: string
      - description: folder
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ReplaceFolderRequest'
      produces:
      - application/json
      responses:
        "200":
