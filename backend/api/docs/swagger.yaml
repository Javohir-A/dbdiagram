  /v1/me/tokens:
    get:
      description: Lists your active (not revoked, not expired) tokens. Needs a login
        session, not a token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TokenList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - ApiKeyAuth: []
      summary: Personal access tokens
      tags:
      - tokens
    post:
      consumes:
      - application/json
      description: Creates a token for scripts and AI agents (including the MCP endpoint).
        The secret is in the response once and is never shown again. Needs a login
        session, not a token.
      parameters:
      - description: token
        in: body
