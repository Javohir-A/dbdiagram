# Runs the images CI built (no source on the server). TAG is the git sha CI passes in.
name: dbdiagram

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-dbdiagram}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-dbdiagram}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: dbdiagram-backend:${TAG:?TAG is set by the deploy script}
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: 8080
      CTX_TIMEOUT: 15
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-dbdiagram}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: disable
      POSTGRES_SEARCH_PATH: dbdiagram,shared,public
      MIGRATE_ON_START: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      # IPs/CIDRs only: the compose network below, where the nginx container lives.
      TRUSTED_PROXIES: 172.28.0.0/24
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    image: dbdiagram-frontend:${TAG}
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:80"

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
