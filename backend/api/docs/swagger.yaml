        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - ApiKeyAuth: []
      summary: Create a personal access token
      tags:
      - tokens
  /v1/me/tokens/{key}:
    delete:
      description: Takes effect immediately. Needs a login session, not a token.
      parameters:
      - description: token guid
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Empty'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "403":
          description: Forbidden
