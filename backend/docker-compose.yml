# Local development only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dbdiagram
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
