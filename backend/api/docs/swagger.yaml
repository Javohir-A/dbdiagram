            $ref: '#/definitions/model.Version'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - ApiKeyAuth: []
      summary: Diagram version get
      tags:
      - versions
  /v1/diagrams/{key}/versions/{version}/restore:
    post:
      description: Replaces the diagram's DBML and layout with the snapshot's; the
        name is kept. The current state is saved as a new snapshot first, so a restore
        can be undone.
      parameters:
      - description: diagram guid
        in: path
        name: key
        required: true
        type: string
      - description: version guid
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
