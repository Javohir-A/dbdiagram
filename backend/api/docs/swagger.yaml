      tags:
      - versions
    get:
      description: Returns one snapshot with its DBML and layout. A version of another
        diagram is not found.
      parameters:
      - description: diagram guid
        in: path
        name: key
        required: true
        type: string
      - description: version guid
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
