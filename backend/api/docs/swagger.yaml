            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - ApiKeyAuth: []
      summary: Revoke a personal access token
      tags:
      - tokens
  /v1/shared/{key}:
    get:
      description: 'Public and read-only: returns the name, DBML and layout behind
